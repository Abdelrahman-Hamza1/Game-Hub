<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Room · Game Night</title>
  <meta name="theme-color" content="#eef1f6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f1328" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <script>try{var t=JSON.parse(localStorage.getItem('gn:theme'));if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=JetBrains+Mono:wght@500;700&display=swap">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/room.css">
</head>
<body>
  <header class="topbar">
    <div class="wrap">
      <a class="logo" href="./" id="logo-link"><span class="token" aria-hidden="true"></span>Game Night</a>
      <span class="room-tag" id="room-tag" hidden>Room <b id="room-tag-code"></b></span>
      <div class="end">
        <button class="btn ghost" type="button" id="leave-btn" hidden>Leave room</button>
        <button class="icon-btn" type="button" data-theme-toggle aria-label="Switch theme"></button>
      </div>
    </div>
  </header>

  <main class="wrap room">
    <!-- Connecting -->
    <section class="state" id="view-connecting">
      <div class="spinner" aria-hidden="true"></div>
      <p id="status-text">Opening a room…</p>
    </section>

    <!-- Error -->
    <section class="state" id="view-error" hidden>
      <h1 id="error-title">Couldn't connect</h1>
      <p class="muted" id="error-text"></p>
      <div class="state-actions">
        <a class="btn primary" href="room.html" id="error-retry">Start a new room</a>
        <a class="btn ghost" href="./">Back to Game Night</a>
      </div>
    </section>

    <!-- Lobby -->
    <section id="view-lobby" class="lobby" hidden>
      <div class="lobby-top">
        <div class="card code-card">
          <p class="eyebrow">Room code</p>
          <div class="code" id="code-text" aria-live="polite"></div>
          <p class="muted">Friends enter this code on the Game Night home page, or open the link.</p>
          <div class="share">
            <label class="visually-hidden" for="share-link">Room link</label>
            <input class="field" id="share-link" readonly>
            <button class="btn ghost" type="button" id="copy-link">Copy link</button>
          </div>
        </div>

        <div class="card players-card">
          <div class="card-head">
            <h2>Players</h2>
            <span class="count" id="player-count"></span>
          </div>
          <ul class="players" id="player-list"></ul>
          <form class="name-form" id="name-form">
            <label for="my-name">Your name</label>
            <div class="row">
              <input class="field" id="my-name" maxlength="20" autocomplete="nickname">
              <button class="btn ghost" type="submit">Save</button>
            </div>
          </form>
        </div>
      </div>

      <div class="card pick-card">
        <div class="card-head">
          <h2 id="pick-title">Pick a game</h2>
        </div>
        <p class="last-result" id="last-result" hidden></p>
        <div class="picker" id="game-picker" role="radiogroup" aria-labelledby="pick-title"></div>
        <div class="start-row">
          <p class="muted" id="start-hint"></p>
          <button class="btn primary big" type="button" id="start-btn" hidden>Start</button>
        </div>
      </div>
    </section>
  </main>

  <!-- In-game: the game runs in a frame so the room connection survives between games -->
  <div class="play" id="view-play" hidden>
    <div class="play-bar">
      <span class="play-title" id="play-title"><i class="dot"></i><span></span></span>
      <span class="play-code" id="play-code"></span>
      <span class="play-players" id="play-players"></span>
      <span class="spacer"></span>
      <button class="btn ghost" type="button" id="howto-btn" hidden>How to play</button>
      <button class="btn ghost" type="button" id="end-btn" hidden>Back to lobby</button>
      <button class="btn ghost" type="button" id="play-leave">Leave</button>
    </div>
    <iframe id="game-frame" title="Game" allow="fullscreen; autoplay; clipboard-write"></iframe>
  </div>

  <dialog class="sheet" id="howto">
    <h3 id="howto-title">How to play</h3>
    <p id="howto-text"></p>
    <form method="dialog" class="actions"><button class="btn primary">Got it</button></form>
  </dialog>

  <dialog class="sheet" id="confirm-leave">
    <h3>Leave this room?</h3>
    <p id="confirm-leave-text">You can rejoin with the code while the room is open.</p>
    <form method="dialog" class="actions" style="gap:8px">
      <button class="btn ghost" value="stay">Stay</button>
      <button class="btn primary" value="leave">Leave room</button>
    </form>
  </dialog>

  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="assets/js/core.js"></script>
  <script src="assets/js/room.js"></script>
</body>
</html>
