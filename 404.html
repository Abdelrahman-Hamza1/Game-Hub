<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Not found · Game Night</title>
  <!-- GitHub Pages serves this for any missing path, at any depth, so styles are inline
       and the home link is worked out from the URL instead of being relative. -->
  <style>
    :root { --bg: #eef1f6; --ink: #141a2e; --muted: #5a6380; --gold: #f2b01e; --accent: #e0452b; color-scheme: light; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0f1328; --ink: #eef1fa; --muted: #9aa3c3; color-scheme: dark; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
      font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; padding: 24px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px)); box-sizing: border-box; }
    main { text-align: center; display: grid; gap: 12px; justify-items: center; max-width: 44ch; }
    .token { width: 64px; height: 64px; border-radius: 50%; background: var(--gold); border: 6px solid var(--ink); position: relative; box-sizing: border-box; }
    .token::after { content: ""; position: absolute; inset: 8px; border-radius: 50%; border: 3px dashed var(--ink); }
    h1 { margin: 8px 0 0; font-size: 1.8rem; line-height: 1.15; }
    p { margin: 0; color: var(--muted); }
    a { display: inline-block; margin-top: 8px; background: var(--accent); color: #fff; font-weight: 700; text-decoration: none; padding: 10px 18px; border-radius: 8px; }
  </style>
</head>
<body>
  <main>
    <div class="token" aria-hidden="true"></div>
    <h1>That page isn't here</h1>
    <p>The link may be old, or the game may have moved.</p>
    <a id="home" href="/">Back to Game Night</a>
  </main>
  <script>
    // On <user>.github.io/<repo>/..., home is /<repo>/. On a custom domain, it's /.
    var seg = location.pathname.split('/')[1];
    if (location.hostname.endsWith('github.io') && seg) document.getElementById('home').href = '/' + seg + '/';
  </script>
</body>
</html>
