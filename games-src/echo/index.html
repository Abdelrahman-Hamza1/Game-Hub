<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Echo · Game Night</title>
  <meta name="description" content="A stealth game where sound is how you see, and sound is how you're found.">
  <meta name="theme-color" content="#05060B">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2305060B'/%3E%3Ccircle cx='32' cy='32' r='5' fill='%23FFC94D'/%3E%3Ccircle cx='32' cy='32' r='14' fill='none' stroke='%234CC9F0' stroke-width='3' opacity='.8'/%3E%3Ccircle cx='32' cy='32' r='24' fill='none' stroke='%234CC9F0' stroke-width='3' opacity='.4'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;700&family=Martian+Mono:wght@400;600;700&family=Syne:wght@600;800&display=swap">
</head>
<body>
  <div id="app">
    <canvas id="view" tabindex="0" aria-label="Echo game view"></canvas>
    <div id="hud" hidden></div>
    <div id="captions" aria-live="polite"></div>
    <div id="touch" hidden></div>
    <div id="screen"></div>
    <div id="toast" role="status" aria-live="polite"></div>
  </div>
  <!-- Game Night hub bar (back link, mute, fullscreen). Echo works without it. -->
  <script src="../../shared/gamenight.js" data-game="echo"></script>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
