# Builds and tests every game in games-src/, then publishes the site to GitHub Pages.
# One-time setup: repo Settings → Pages → Build and deployment → Source: GitHub Actions.
name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: games-src/*/package-lock.json
      - name: Test and build the games
        run: node scripts/build-games.mjs --ci
      - name: Collect the site
        # Everything the browser needs; sources, tooling and docs stay out.
        run: |
          rsync -a --exclude .git --exclude .github --exclude games-src --exclude scripts \
            --exclude node_modules --exclude '*.md' ./ _site/
          ls _site _site/games
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
